<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: file:">
<title>Editor</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: hidden; }
  #ed { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

  /* ---- top bar ---- */
  .top {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; -webkit-app-region: drag;
    border-bottom: 1px solid var(--line);
  }
  .top .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; }
  .top .spacer { flex: 1; }
  .top button, .top .file { -webkit-app-region: no-drag; }
  .file { font-size: 12.5px; color: var(--dim); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- stage ---- */
  .mid { flex: 1; display: flex; min-height: 0; }
  .stage {
    flex: 1; display: grid; place-items: center;
    padding: 18px; min-width: 0; background: #08090c;
  }
  .frame { position: relative; line-height: 0; box-shadow: 0 20px 60px -18px #000; }
  .frame video { max-width: 100%; max-height: 58vh; display: block; background: #000; }
  /* overlays live in here, positioned in % so they scale with the video */
  .layer { position: absolute; inset: 0; overflow: hidden; }
  .blur-box {
    position: absolute; backdrop-filter: blur(var(--b, 12px));
    border: 1px solid rgba(124, 92, 255, .5); cursor: move;
  }
  .blur-box.idle { border-color: transparent; }
  .txt {
    position: absolute; white-space: pre; cursor: move;
    font-weight: 700; line-height: 1.15; text-shadow: 0 2px 14px rgba(0,0,0,.5);
  }
  .sel-ring { outline: 2px solid var(--accent); outline-offset: 2px; }
  .handle {
    position: absolute; right: -5px; bottom: -5px; width: 12px; height: 12px;
    background: var(--accent); border: 2px solid #fff; border-radius: 3px; cursor: nwse-resize;
  }

  /* ---- inspector ---- */
  .side {
    width: 268px; flex: none; border-left: 1px solid var(--line);
    padding: 14px; overflow-y: auto; background: rgba(255,255,255,.02);
  }
  .side h4 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); margin: 14px 0 8px; }
  .side h4:first-child { margin-top: 0; }
  .fld { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; font-size: 12.5px; }
  .fld label { color: var(--dim); width: 66px; flex: none; }
  .fld input[type=range] { flex: 1; accent-color: var(--accent); }
  .fld input[type=text], .fld input[type=number] {
    flex: 1; min-width: 0; font: inherit; font-size: 12.5px; padding: 6px 9px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); color: var(--txt); outline: 0;
  }
  .fld .val { width: 34px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty-note { color: var(--dim); font-size: 12px; line-height: 1.5; }

  /* ---- transport ---- */
  .transport { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  .transport .t { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--dim); }
  .play {
    width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; display: grid; place-items: center;
  }
  .play svg { width: 15px; height: 15px; fill: currentColor; }

  /* ---- timeline ---- */
  .tl { border-top: 1px solid var(--line); padding: 10px 16px 14px; background: rgba(0,0,0,.25); }
  .ruler { height: 16px; position: relative; margin-left: 44px; color: var(--dim); font-size: 10px; }
  .ruler span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
  .track { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .track .name { width: 36px; flex: none; font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: .06em; }
  .lane {
    position: relative; flex: 1; height: 42px; border-radius: 8px;
    background: rgba(255,255,255,.045); border: 1px solid var(--line); overflow: hidden;
  }
  .lane.audio { height: 28px; }
  .lane.fx { height: 50px; }
  .clip {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(124,92,255,.5), rgba(124,92,255,.28));
    border: 1px solid rgba(124,92,255,.8); border-radius: 7px;
  }
  .clip.music { background: linear-gradient(180deg, rgba(46,230,168,.45), rgba(46,230,168,.22)); border-color: rgba(46,230,168,.8); }
  .item {
    position: absolute; height: 20px; border-radius: 5px; cursor: pointer;
    background: rgba(255,210,63,.35); border: 1px solid rgba(255,210,63,.9);
    font-size: 10px; line-height: 18px; padding: 0 5px; overflow: hidden; white-space: nowrap;
  }
  .item.blur { background: rgba(77,163,255,.3); border-color: rgba(77,163,255,.9); }
  .item.on { outline: 2px solid #fff; }
  /* trim handles */
  .trim { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; background: var(--accent); }
  .trim::after { content: ''; position: absolute; left: 3px; top: 50%; transform: translateY(-50%); width: 2px; height: 14px; background: #fff; border-radius: 2px; }
  .trim.a { border-radius: 7px 0 0 7px; }
  .trim.b { border-radius: 0 7px 7px 0; }
  .shade { position: absolute; top: 0; bottom: 0; background: rgba(8,9,12,.72); pointer-events: none; }
  .play-head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--rec); pointer-events: none; z-index: 5; }
  .play-head::before { content: ''; position: absolute; top: -4px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--rec); }

  #busy {
    position: fixed; inset: 0; z-index: 40; display: none; place-items: center;
    background: rgba(8,9,12,.86); backdrop-filter: blur(10px);
  }
  #busy.on { display: grid; }
  .bar-outer { width: 320px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 14px; }
  .bar-inner { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
</style>

<div id="ed">
  <div class="top">
    <div class="brand"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--accent)"></span> Editor</div>
    <span class="file" id="fname">No video</span>
    <div class="spacer"></div>
    <button class="btn" id="open">Open video…</button>
    <button class="btn primary" id="export" disabled>Export</button>
    <button class="icon-btn close" id="close" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="mid">
    <div class="stage">
      <div class="frame" id="frame">
        <video id="v" preload="auto"></video>
        <div class="layer" id="layer"></div>
      </div>
    </div>
    <div class="side" id="side"></div>
  </div>

  <div class="transport">
    <button class="play" id="play"><svg id="play-i" viewBox="0 0 24 24"><path d="M7 4l12 8-12 8V4z"/></svg></button>
    <span class="t" id="clock">00:00.0 / 00:00.0</span>
    <div class="spacer" style="flex:1"></div>
    <div class="row-btns">
      <button class="btn" id="add-text">+ Text</button>
      <button class="btn" id="add-blur">+ Blur</button>
      <button class="btn" id="add-music">+ Music</button>
    </div>
  </div>

  <div class="tl">
    <div class="ruler" id="ruler"></div>
    <div class="track">
      <span class="name">V1</span>
      <div class="lane" id="lane-v"><div class="play-head" id="ph"></div></div>
    </div>
    <div class="track">
      <span class="name">FX</span>
      <div class="lane fx" id="lane-fx"></div>
    </div>
    <div class="track">
      <span class="name">A2</span>
      <div class="lane audio" id="lane-a"></div>
    </div>
  </div>
</div>

<div id="busy">
  <div style="text-align:center">
    <div style="font-weight:600" id="busy-t">Exporting…</div>
    <div class="bar-outer"><div class="bar-inner" id="busy-b"></div></div>
    <div style="color:var(--dim);font-size:12px;margin-top:10px" id="busy-s"></div>
  </div>
</div>

<script src="editor.js"></script>
