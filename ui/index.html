<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:">
<title>Recorder</title>
<link rel="stylesheet" href="style.css">

<div id="app">
  <header>
    <div class="brand"><span class="dot"></span> Recorder</div>
    <div class="spacer"></div>
    <div class="tabs">
      <button data-tab="record" class="on">Record</button>
      <button data-tab="settings">Settings</button>
    </div>
    <button class="icon-btn" id="open-editor" title="Open a video in the editor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5h16v13H4z"/><path d="M9 5.5v13M15 5.5v13"/><path d="M4 12h16"/>
      </svg>
    </button>
    <div class="wctl" id="wctl">
      <button class="icon-btn" id="w-min" title="Minimize">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>
      </button>
      <button class="icon-btn close" id="w-close" title="Close">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="pane on" id="pane-record">
      <p class="hint">Pick a screen or window. Drawing tools need a full screen — overlays aren't part of a single window's pixels.</p>
      <div id="sources"><div class="empty">Loading sources…</div></div>
    </section>

    <section class="pane" id="pane-settings">
      <div class="set-grid" id="settings-form"></div>
    </section>
  </main>

  <footer>
    <button class="toggle on" id="t-mic">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
      </svg>
      <span>Mic</span>
    </button>
    <button class="toggle on" id="t-sys">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>
      </svg>
      <span>System audio</span>
    </button>
    <button class="toggle" id="btn-region">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 8V5.5A1.5 1.5 0 0 1 4.5 4H8M16 4h3.5A1.5 1.5 0 0 1 21 5.5V8M21 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H4.5A1.5 1.5 0 0 1 3 18.5V16"/>
      </svg>
      <span>Select area</span>
    </button>
    <span class="chip" id="region-chip">
      <b id="region-dims"></b>
      <button class="chip-x" id="region-clear" title="Record the whole screen instead">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </span>
    <div class="spacer"></div>
    <kbd id="kbd-rec">Ctrl+Shift+R</kbd>
    <button class="rec-btn" id="btn-rec" disabled><span class="sq"></span> Record</button>
  </footer>
</div>

<div id="preview">
  <div class="box">
    <video id="pv" controls></video>
    <div class="bar">
      <div class="info"><b id="pv-name">recording.webm</b><span id="pv-meta"></span></div>
      <button class="btn danger" id="pv-del">Delete</button>
      <button class="btn" id="pv-folder">Show in folder</button>
      <button class="btn" id="pv-edit">Edit…</button>
      <button class="btn primary" id="pv-done">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../node_modules/fix-webm-duration/fix-webm-duration.js"></script>
<script src="app.js"></script>
